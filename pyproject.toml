[project]
name = "course_validator"
version = "0.1.0"
description = "Course idea validator and analyzer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "motor",
    "pydantic",
    "pydantic_settings",
    "openai>=1.90.0",
    "python-dotenv",
    "pytrends",  # For Google Trends analysis
    "beautifulsoup4",  # For web scraping
    "httpx",  # For async HTTP requests
    "pytest",  # For testing
    "pytest-asyncio",  # For async tests
    "mypy",  # For type checking
    "ruff",  # For linting
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/course_validator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"